<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Không có quyền truy cập — Turfline Stable Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--canvas, #eceae0);
  }
  .error-card {
    background: var(--parchment, #fcfbf7);
    border: 1px solid rgba(0,0,0,.08);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 440px;
    width: 90%;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
  }
  .error-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
    line-height: 1;
  }
  .error-code {
    font-family: var(--serif, 'Fraunces', serif);
    font-size: 5rem;
    font-weight: 700;
    color: var(--brass, #c1663f);
    line-height: 1;
    margin-bottom: .5rem;
  }
  .error-title {
    font-family: var(--serif, 'Fraunces', serif);
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--ink, #141b2e);
    margin-bottom: .75rem;
  }
  .error-desc {
    color: #6b6349;
    font-size: .9rem;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  .error-actions {
    display: flex;
    gap: .75rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .6rem 1.2rem;
    background: var(--ink, #141b2e);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: .88rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: opacity .15s;
  }
  .btn-back:hover { opacity: .85; }
  .btn-logout-link {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .6rem 1.2rem;
    background: transparent;
    color: var(--ink, #141b2e);
    border: 1px solid rgba(0,0,0,.15);
    border-radius: 8px;
    font-family: inherit;
    font-size: .88rem;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .btn-logout-link:hover { background: rgba(0,0,0,.04); }
  .role-hint {
    margin-top: 1.5rem;
    padding: .75rem 1rem;
    background: #fff8f6;
    border-radius: 8px;
    border: 1px solid rgba(193,102,63,.15);
    font-size: .8rem;
    color: #a0714a;
  }
</style>
</head>
<body class="error-page">

<div class="error-card">
  <div class="error-icon">🔒</div>
  <div class="error-code">403</div>
  <h1 class="error-title">Không có quyền truy cập</h1>
  <p class="error-desc">
    Vai trò hiện tại của bạn không được phép truy cập trang này.
    Vui lòng liên hệ Quản lý câu lạc bộ nếu bạn cần quyền truy cập.
  </p>
  <div class="error-actions">
    <a href="dashboard.html" class="btn-back">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Về Dashboard
    </a>
    <a href="#" class="btn-logout-link" id="logoutBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Đăng xuất
    </a>
  </div>
  <div class="role-hint" id="roleHint" style="display:none">
    Bạn đang đăng nhập với vai trò: <strong id="currentRole"></strong>
  </div>
</div>

<script type="module">
  import { getAuth, logout } from './auth.js';

  const ROLE_LABELS = {
    CLUB_MANAGER: 'Quản lý câu lạc bộ',
    HEAD_TRAINER: 'Huấn luyện viên Trưởng',
    HORSE_OWNER: 'Chủ sở hữu ngựa',
    STABLE_STAFF: 'Nhân viên chuồng',
    VETERINARIAN: 'Bác sĩ thú y',
  };

  const auth = getAuth();
  if (auth?.user?.roles?.[0]) {
    document.getElementById('roleHint').style.display = 'block';
    document.getElementById('currentRole').textContent =
      ROLE_LABELS[auth.user.roles[0]] || auth.user.roles[0];
  }

  document.getElementById('logoutBtn').addEventListener('click', (e) => {
    e.preventDefault();
    logout();
  });
</script>

</body>
</html>
