<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chuyển hướng...</title>
  <script>
    // Kiểm tra nếu đã có token đăng nhập thì vào luôn dashboard, ngược lại vào login
    const token = localStorage.getItem('stride_auth');
    if (token) {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  Đang chuyển hướng...
</body>
</html>
