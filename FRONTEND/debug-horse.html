<!doctype html>
<html lang="vi">
  <head><meta charset="UTF-8"><title>Horse model diagnostic</title></head>
  <body style="margin:0;background:#eef1ec;font:16px sans-serif">
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import HorseBodyModel3D from './src/components/horse3d/HorseBodyModel3D.jsx'
      import { BODY_REGION_MAP } from './src/components/horse3d/bodyRegionMap.js'
      const group = new URLSearchParams(location.search).get('group') || 'body'
      const code = new URLSearchParams(location.search).get('code')
      const prefixes = { head: ['HEAD_', 'NECK_'], body: ['BACK_', 'CROUP', 'CHEST', 'ABDOMEN', 'FLANK'], fore: ['FL_', 'TENDON_'], hind: ['HL_'] }
      const codes = code ? [code] : Object.keys(BODY_REGION_MAP).filter((item) => prefixes[group].some((prefix) => item.startsWith(prefix)))
      const injuries = codes.map((code) => ({ id: code, bodyRegions: [code], severity: 'MODERATE', notes: code }))
      createRoot(document.getElementById('root')).render(React.createElement('main', { style: { width: 1100, margin: '20px auto' } },
        React.createElement('h1', null, group + ' — ' + codes.length + ' points'),
        React.createElement(HorseBodyModel3D, { injuries, height: 650 }),
        React.createElement('pre', null, codes.join('  '))))
    </script>
  </body>
</html>
