spring.application.name=racehorse-backend
server.port=${SERVER_PORT:8080}

# Database connection is configured through environment variables on the host.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use SQL scripts in /database; Hibernate must not create or update tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Web client
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.vercel.app,https://*.loca.lt,https://*.ngrok-free.app,https://*.trycloudflare.com}
app.club-time-zone=${CLUB_TIME_ZONE:Asia/Ho_Chi_Minh}
app.jobs.daily-cron=${DAILY_JOB_CRON:0 0 6 * * *}
app.payos.gateway=${PAYOS_GATEWAY:fake}

# JWT and login session
app.jwt.issuer=${JWT_ISSUER:racehorse-backend}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}

# Cloudinary profile files (keep API secret in environment variables)
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.folder=${CLOUDINARY_FOLDER:racehorse}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.racehorse=INFO
