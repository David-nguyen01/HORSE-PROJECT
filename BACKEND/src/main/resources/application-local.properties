# Run with SPRING_PROFILES_ACTIVE=local to use a local PostgreSQL instance.
server.address=127.0.0.1
spring.datasource.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/racehorse_local}
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:${RACEHORSE_LOCAL_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO dbo,public
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://horse-project-phi.vercel.app}
app.payos.gateway=${PAYOS_GATEWAY:vnpay}
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/wallet}
