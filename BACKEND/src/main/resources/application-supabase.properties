# Activate only after applying the PostgreSQL schema and query migration.
# Use the JDBC URL from Supabase Connect > Session pooler (port 5432).
# Keep connection credentials in environment variables, never in Git.
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO dbo,public
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:120000}
# Disable server-side prepared statements so the connection also remains safe
# if the Supabase pooler mode is changed in the hosting dashboard.
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.ddl-auto=none
