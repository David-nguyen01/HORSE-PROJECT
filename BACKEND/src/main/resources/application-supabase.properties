# Activate only after applying the PostgreSQL schema and query migration.
# Use the JDBC URL from Supabase Connect > Session pooler (port 5432).
# Keep connection credentials in environment variables, never in Git.
spring.datasource.url=${SUPABASE_DB_URL:${DB_URL}}
spring.datasource.username=${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SUPABASE_DB_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO dbo,public
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.ddl-auto=none
